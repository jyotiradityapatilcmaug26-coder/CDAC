  <main class="page-wrap">
    <section class="hero">
      <h1>Contact me</h1>
      <p>Use this sample form to practise HTML form controls.</p>
    </section>
    <form id="contact-form" action="https://example.com/contact" method="post" enctype="multipart/form-data">
      <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text"
          placeholder="Your full name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email"
          placeholder="you@example.com" required></div>
      <div class="field"><label for="contact-date">Preferred contact date</label><input id="contact-date"
          name="contactDate" type="date"></div>
      <div class="field"><label for="enquiry">Enquiry type</label><select id="enquiry" name="enquiry">
          <option value="">Choose one</option>
          <option value="project">Project</option>
          <option value="learning">Learning</option>
          <option value="other">Other</option>
        </select></div>
      <div class="field"><span>Preferred contact mode</span>
        <div class="inline-options"><label><input type="radio" id="mode-email" name="contactMode" value="email" checked>
            Email</label><label><input type="radio" id="mode-phone" name="contactMode" value="phone"> Phone</label>
        </div>
      </div>
      <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"
          placeholder="Write your message"></textarea></div>
      <div class="field"><label for="cv">CV upload (optional)</label><input id="cv" name="cv" type="file"
          accept=".pdf,.doc,.docx"></div>
      <div class="field"><label><input id="consent" name="consent" type="checkbox" required> I agree to be contacted
          about this enquiry.</label></div>
      <div class="inline-options"><button type="submit">Submit</button><button type="reset">Reset</button></div>
    </form>
    <h2>Jalgaon / CDAC location</h2>
    <p>Replace this example map with your college or city map if required.</p><iframe title="Map of Jalgaon"
      src="https://www.openstreetmap.org/export/embed.html?bbox=75.52%2C20.98%2C75.60%2C21.03&amp;layer=mapnik"
      width="100%" height="320" style="border:1px solid #cbd5e1" loading="lazy"></iframe>
  </main>
