<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>New Joiner Onboarding | TechNova</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="login.html">Login</a><a href="directory.html">Directory</a><a href="onboarding.html">Onboarding</a></nav><main class="panel"><h1>New Joiner Onboarding</h1><p>Sample form for the imaginary TechNova Solutions client.</p><form action="https://example.com/onboarding" method="post" enctype="multipart/form-data">
<div class="field"><label for="full-name">Full name</label><input id="full-name" name="fullName" type="text" placeholder="Enter your full name" required></div>
<div class="field"><label for="official-email">Official email</label><input id="official-email" name="officialEmail" type="email" placeholder="name@technova.example" required></div>
<div class="field"><label for="temporary-password">Temporary password</label><input id="temporary-password" name="temporaryPassword" type="password" required></div>
<div class="field"><label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required></div>
<div class="field"><label for="joining-date">Joining date</label><input id="joining-date" name="joiningDate" type="date" required></div>
<div class="field"><label for="orientation">Orientation slot</label><input id="orientation" name="orientation" type="datetime-local" required></div>
<div class="field"><label for="reporting-time">Reporting time on day one</label><input id="reporting-time" name="reportingTime" type="time" required></div>
<div class="field"><span>Gender</span><div class="options"><label><input id="gender-female" name="gender" type="radio" value="female"> Female</label><label><input id="gender-male" name="gender" type="radio" value="male"> Male</label><label><input id="gender-other" name="gender" type="radio" value="other"> Prefer not to say / Other</label></div></div>
<div class="field"><label for="qualification">Highest qualification</label><select id="qualification" name="qualification" required><option value="">Select qualification</option><option value="school">School</option><option value="diploma">Diploma</option><option value="bachelor">Bachelor's degree</option><option value="master">Master's degree</option><option value="other">Other</option></select></div>
<div class="field"><label for="department">Department</label><select id="department" name="department" required><option value="">Select department</option><option value="engineering">Engineering</option><option value="hr">Human Resources</option><option value="design">Design</option><option value="finance">Finance</option><option value="marketing">Marketing</option></select></div>
<div class="field"><label for="address">Current address</label><textarea id="address" name="address" rows="4" placeholder="Enter current address" required></textarea></div>
<div class="field"><label for="resume">Passport photo or resume</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required></div>
<div class="field"><label><input id="declaration" name="declaration" type="checkbox" required> I declare that the information provided is accurate.</label></div>
<div class="options"><button type="submit">Submit</button><button type="reset">Reset</button><!-- This plain button is intentionally inactive until JavaScript or a help page is added. --><button type="button">Need help?</button></div>
</form><h2>TechNova office map</h2><iframe title="Example office map" src="https://www.openstreetmap.org/export/embed.html?bbox=72.82%2C18.96%2C72.84%2C18.98&amp;layer=mapnik" width="100%" height="280" style="border:1px solid #cbd5e1" loading="lazy"></iframe><p><small>Illustrative map only; replace with the imaginary office's chosen location.</small></p></main></body></html>
