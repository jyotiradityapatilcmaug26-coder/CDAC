<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Jyotiraditya Patil</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-span {
      color: #dc2626;
      font-size: 0.85rem;
      font-weight: 600;
      display: block;
      margin-top: 0.25rem;
    }
    #thank-you-box {
      display: none;
      padding: 1.25rem;
      background: #ecfdf5;
      border: 1px solid #10b981;
      border-radius: 6px;
      color: #065f46;
      margin-bottom: 1.5rem;
    }
    #thank-you-box h3 {
      margin-top: 0;
      color: #047857;
    }
  </style>
</head>

<body>
  <header id="main-nav">
    <a class="brand" href="index.html"><img class="logo" src="images/profile.svg" alt="JP logo"><span>JP |
        Portfolio</span></a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a><a
        href="https://github.com/jyotiraditya-patil" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>
  <main class="page-wrap">
    <section class="hero">
      <h1>Contact me</h1>
      <p>Send a message or enquiry using real-time validated form controls.</p>
    </section>

    <!-- Success banner -->
    <div id="thank-you-box" role="alert"></div>

    <form id="contact-form" action="#" method="post" onsubmit="return validate()">
      <div class="field">
        <label for="name">Full name *</label>
        <input id="name" name="name" type="text" placeholder="Your full name" onkeyup="validateName()">
        <span class="error-span" id="name-error"></span>
      </div>

      <div class="field">
        <label for="email">Email address *</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" onkeyup="validateEmail()">
        <span class="error-span" id="email-error"></span>
      </div>

      <div class="field">
        <label for="phone">Phone number (10 digits) *</label>
        <input id="phone" name="phone" type="tel" placeholder="e.g. 9876543210" onkeyup="validatePhone()">
        <span class="error-span" id="phone-error"></span>
      </div>

      <div class="field">
        <label for="contact-date">Preferred contact date</label>
        <input id="contact-date" name="contactDate" type="date">
      </div>

      <div class="field">
        <label for="enquiry">Enquiry type</label>
        <select id="enquiry" name="enquiry">
          <option value="">Choose one</option>
          <option value="project">Project</option>
          <option value="learning">Learning</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <span>Preferred contact mode</span>
        <div class="inline-options">
          <label><input type="radio" id="mode-email" name="contactMode" value="email" checked> Email</label>
          <label><input type="radio" id="mode-phone" name="contactMode" value="phone"> Phone</label>
        </div>
      </div>

      <div class="field">
        <label for="message">Message (at least 20 characters) *</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." onkeyup="validateMessage()"></textarea>
        <span class="error-span" id="message-error"></span>
      </div>

      <div class="field">
        <label for="cv">CV upload (optional)</label>
        <input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx">
      </div>

      <div class="field">
        <label><input id="consent" name="consent" type="checkbox"> I agree to be contacted about this enquiry.</label>
      </div>

      <div class="inline-options">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>

    <h2>Jalgaon / CDAC location</h2>
    <p>Location map for campus and correspondence.</p>
    <iframe title="Map of Jalgaon"
      src="https://www.openstreetmap.org/export/embed.html?bbox=75.52%2C20.98%2C75.60%2C21.03&amp;layer=mapnik"
      width="100%" height="320" style="border:1px solid #cbd5e1" loading="lazy"></iframe>
  </main>

  <footer>
    <a href="index.html">Home</a> · <a href="projects.html">Projects</a>
  </footer>

  <script src="js/contact.js"></script>
</body>

</html>
