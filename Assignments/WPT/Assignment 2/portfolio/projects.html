<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Jyotiraditya Patil</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin: 1.5rem 0 1rem;
      padding: 1rem;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .filter-controls input, .filter-controls select {
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .filter-controls button {
      padding: 0.5rem 1rem;
      background: #2357a6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .filter-controls button:hover {
      background: #173b75;
    }
    #project-counter {
      font-weight: 600;
      color: #315b8a;
      margin: 0.5rem 0;
    }
    #loading-status {
      font-weight: bold;
      color: #2357a6;
      margin: 1rem 0;
    }
    #stats-summary {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <header id="main-nav">
    <a class="brand" href="index.html"><img class="logo" src="images/profile.svg" alt="JP logo"><span>JP |
        Portfolio</span></a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a><a
        href="https://github.com/jyotiraditya-patil" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>
  <main class="page-wrap">
    <section class="hero">
      <h1>Projects &amp; Practice</h1>
      <p>Coursework and learning projects, loaded dynamically from JavaScript classes.</p>
    </section>

    <h2>Project overview</h2>

    <!-- Search and filter controls -->
    <div class="filter-controls">
      <label for="search-input">Search Title:</label>
      <input type="text" id="search-input" placeholder="Filter projects by title..." onkeyup="filterProjects()">

      <label for="tech-filter">Technology:</label>
      <select id="tech-filter" onchange="filterProjects()">
        <option value="all">All Technologies</option>
      </select>

      <button type="button" id="sort-btn" onclick="toggleSortByTitle()">Sort Title (A-Z)</button>
    </div>

    <!-- Live status and counter displays -->
    <p id="loading-status">Loading projects...</p>
    <p id="project-counter">Showing 0 of 0 projects</p>
    <p id="stats-summary"></p>

    <!-- Dynamic project table -->
    <table id="project-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Tech used</th>
          <th>Description</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filled dynamically by JavaScript createElement -->
      </tbody>
    </table>

    <h2>Featured practice</h2>
    <div id="featured-cards-container" class="project-cards">
      <!-- Built dynamically using FeaturedProject instances with badges -->
    </div>
  </main>

  <footer>
    <a href="index.html">Home</a> · <a href="contact.html">Contact</a>
  </footer>

  <script src="js/projects.js"></script>
</body>

</html>
