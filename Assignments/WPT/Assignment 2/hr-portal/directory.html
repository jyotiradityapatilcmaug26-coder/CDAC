<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory | TechNova</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .directory-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin: 1.5rem 0 1rem;
            padding: 1rem;
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }
        .directory-controls input, .directory-controls select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .action-button {
            padding: 8px 14px;
            background: #1e3a8a;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .action-button:hover {
            background: #172554;
        }
        .remove-button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .remove-button:hover {
            background: #dc2626;
        }
        .add-form-card {
            background: #ffffff;
            padding: 1.25rem;
            margin: 1.5rem 0;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }
        .add-form-card form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .add-form-card input, .add-form-card select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        #directory-error {
            color: #dc2626;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        #directory-status {
            color: #2563eb;
            font-weight: 500;
            margin: 0.5rem 0;
        }
        #total-count {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e293b;
            margin: 1rem 0;
        }
    </style>
</head>

<body>
    <nav>
        <a href="login.html">Login</a>
        <a href="directory.html">Directory</a>
        <a href="onboarding.html">Onboarding</a>
    </nav>
    <main class="panel">
        <h1>Employee Directory</h1>
        <p>Live employee records loaded dynamically from the API server.</p>

        <!-- Server data loader and search controls -->
        <div class="directory-controls">
            <button type="button" id="load-btn" class="action-button" onclick="loadEmployees()">Load employees</button>

            <label for="search-field" style="margin-left: 10px; font-weight: 600;">Search by:</label>
            <select id="search-field" onchange="searchEmployees()">
                <option value="name">Name</option>
                <option value="email">Email</option>
                <option value="username">Username</option>
            </select>

            <input type="text" id="search-text" placeholder="Type search term..." onkeyup="searchEmployees()">
        </div>

        <div id="directory-status"></div>
        <div id="directory-error"></div>

        <!-- Add Employee Form -->
        <section class="add-form-card">
            <h3>Add New Employee</h3>
            <form onsubmit="return handleAddEmployee(event)">
                <label for="new-emp-name">Name:</label>
                <input type="text" id="new-emp-name" placeholder="Full Name" required>

                <label for="new-emp-dept">Department:</label>
                <select id="new-emp-dept" required>
                    <option value="">Select Department</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Design">Design</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                </select>

                <button type="submit" class="action-button">Add Employee</button>
            </form>
        </section>

        <!-- Employee Directory Table -->
        <table id="employee-table">
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Built dynamically with loop and createElement -->
            </tbody>
        </table>

        <!-- Live Total Employees Display -->
        <p id="total-count">Total employees: 0</p>
    </main>

    <script src="js/directory.js"></script>
</body>

</html>
